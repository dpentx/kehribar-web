name: Contributions bot

# Başkalarının projelerine merge edilen PR'larını ve commit'lerini tarar,
# contributions.nix'e yeni projeleri (ikonuyla birlikte) ekler.
# GitHub, başka repoların olaylarını bu repoya iletemediği için bot düzenli
# aralıklarla (6 saatte bir) tarar; istersen Actions sekmesinden elle de çalıştırabilirsin.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      direct:
        description: "PR açmadan doğrudan main'e commit at"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contributions-bot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Yeni katkıları tara
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRIB_USER: dpentx
        run: node scripts/update-contributions.mjs --summary .bot-summary.md

      - name: Commit / PR
        if: steps.scan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIRECT: ${{ inputs.direct == true || vars.BOT_DIRECT_COMMIT == 'true' }}
          COUNT: ${{ steps.scan.outputs.count }}
        run: |
          git config user.name "kehribar-bot"
          git config user.email "kehribar-bot@users.noreply.github.com"
          MSG="Katkılar: ${COUNT} yeni proje eklendi (bot)"

          if [ "$DIRECT" = "true" ]; then
            git add contributions.nix public/icons
            git commit -m "$MSG"
            git push origin HEAD:main
            exit 0
          fi

          BRANCH="bot/contributions"
          git checkout -B "$BRANCH"
          git add contributions.nix public/icons
          git commit -m "$MSG"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title "$MSG" --body-file .bot-summary.md \
              || echo "::warning::PR açılamadı. Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests' seçeneğini aç."
          else
            echo "Açık bir bot PR'ı zaten var, branch güncellendi."
          fi
